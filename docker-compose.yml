services:
  backend:
    build: ./university-lost-found-backend
    ports:
      - "3001:3001"
    env_file:
      - ./university-lost-found-backend/.env
    restart: always

  frontend:
    build:
      context: ./university-lost-found-frontend
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    env_file:
      - ./university-lost-found-frontend/.env
    depends_on:
      - backend
    restart: always